# RemoteClaw Configuration
# Copy to config.yaml and fill in your values.
# Environment variables referenced with ${VAR} are expanded at load time.
# If a .env file exists in the working directory, it is loaded first (overrides system env vars).

# Connection mode: "native" or "wmcp"
mode: native

# Native Webex mode settings
webex:
  bot_token: "${WEBEX_BOT_TOKEN}"
  allowed_emails:
    - "admin@company.com"
    - "ops-team@company.com"

# WMCP mode settings (when mode: wmcp)
wmcp:
  endpoint: "https://wmcp.example.com"
  token: "${WMCP_TOKEN}"

# AI
ai:
  # provider: "" (default) or "inferd" → local inferd daemon;
  #           "openai-compat" → remote OpenAI-compatible HTTP API.
  # Empty resolves to openai-compat when openai_base_url is set, else inferd.
  provider: ""

  # mode: "interpret" (default) → local AI loop interprets requests and drives tools.
  #       "passthrough"          → treat chat like SSH: run the message directly as a
  #                                command with NO local inference. All guardrails still apply.
  mode: "interpret"

  # model: openai-compat model name (e.g. "gpt-4o", "llama3.1"). Ignored by inferd —
  # the daemon owns the warm model.
  model: ""

  temperature: 0.2       # capped at 0.3 for safety consistency
  max_tokens: 4096
  max_iterations: 10

  # inferd (local): optional socket/pipe path override. Empty = platform default
  # (unix: $XDG_RUNTIME_DIR/inferd/inferd.sock; windows: \\.\pipe\inferd).
  inferd_socket: ""

  # openai-compat (remote): setting openai_base_url selects the openai-compat provider.
  #   Ollama:   http://localhost:11434/v1
  #   mantle:   https://mantle.internal/v1   (Bedrock-as-OpenAI)
  #   OpenAI:   https://api.openai.com/v1
  openai_base_url: ""
  openai_api_key: "${OPENAI_API_KEY}"   # may be empty for local endpoints

# Security
security:
  dangerous_commands: true           # Block dangerous commands (rm -rf /, etc.)
  audit_log: ""                      # Audit log file path (empty = disabled)
  rate_limit_per_min: 10             # Max requests per minute per space (0 = disabled)
  challenge: "${CHALLENGE}"          # AES-GCM ciphertext for destructive-command confirmation (empty = disabled).
                                     # The passphrase (decryption key) is NEVER stored — it lives with the operator
                                     # and is supplied via chat. Only this non-sensitive ciphertext lives here.

  # Config/secret lockdown: deny the agent's OWN tools access to config and secrets.
  # Default true (secure). The authoritative enforcement is the OS — the installer runs
  # the service as a low-privilege account and root-owns config/secrets — this flag is the
  # in-process defense-in-depth layer. Set false to opt out to "wide open".
  lockdown: true
  # Extra paths the agent's tools must never read/modify. The config file + its directory,
  # the pass store, and the binary directory are protected automatically.
  protected_paths: []

# Secrets: service tokens (webex bot token, wmcp token, openai api key) are read from the
# native `pass` store (passwordstore.org) under the remoteclaw/ prefix when available,
# overriding the env/.env values below. If pass is unavailable, RemoteClaw falls back to
# .env / environment variables and logs a warning (less secure at rest).
#   pass insert remoteclaw/webex_bot_token

# Execution
execution:
  default_timeout: "30s"
  max_timeout: "5m"
  shell: ""  # auto-detect: sh on Linux/macOS, powershell on Windows

# Logging
logging:
  level: "info"
  format: "json"
  file: ""  # empty = stdout only

# Health check
health:
  enabled: true
  addr: "127.0.0.1:9090"
