name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The full gate (gofmt, vet, lint, race test) lives in ci.yml so push, PR, and
  # release all run the same definition. build depends on it, so a tag that fails
  # the gate produces no artifacts and no release.
  gate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gate
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: remoteclaw-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: remoteclaw-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: remoteclaw-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: remoteclaw-darwin-arm64
          - goos: windows
            goarch: amd64
            artifact: remoteclaw-windows-amd64.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MODULE="github.com/3rg0n/remoteclaw"
          go build -ldflags "-s -w \
            -X ${MODULE}/internal/config.Version=${VERSION} \
            -X ${MODULE}/internal/config.Commit=${COMMIT} \
            -X ${MODULE}/internal/config.Date=${DATE}" \
            -o ${{ matrix.artifact }} ./cmd/remoteclaw

      # Left at the default `archive: true` (added in v7): the download side
      # unzips only what it recognizes as zipped, so an unarchived upload here
      # would change what the release job receives.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # v8 defaults `digest-mismatch` to `error`, so a download whose hash does
      # not match the server's fails the job instead of logging a warning. Kept
      # at the default deliberately: these artifacts are the release binaries
      # the checksums below are computed over.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > CHECKSUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: artifacts/*
